project:
  name: "Activity-Recognition-CNN-LSTM"
  seed: 42

data:
  raw_dir: "c:/Users/DELL/OneDrive/Documents/AI_Project/AI_project_2/wisdm+smartphone+and+smartwatch+activity+and+biometrics+dataset/wisdm-dataset/wisdm-dataset/data/raw"
  fallback_raw_dir: "data/raw"
  processed_dir: "data/processed"
  devices:
    - "phone"
  sensors:
    - "accel"
  features:
    - "X"
    - "Y"
    - "Z"
  activity_map:
    A: 0
    B: 1
    C: 2
    D: 3
    E: 4
    H: 5
    I: 5
    J: 5
    L: 5
  class_names:
    - "Walking"
    - "Jogging"
    - "Stairs"
    - "Sitting"
    - "Standing"
    - "Eating"

segmentation:
  time_steps: 100
  step: 50
  label_strategy: "majority"

split:
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  stratify: true

model:
  in_channels: 3
  conv_filters: 64
  kernel_size: 3
  lstm_hidden_size: 100
  lstm_num_layers: 2
  dropout: 0.5
  fc_hidden_size: 100
  num_classes: 6

training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  device: "auto"
  checkpoint_path: "models/cnn_lstm_best.pt"
  scaler_path: "models/scaler_stats.json"

results:
  plots_dir: "results/plots"
  metrics_dir: "results/metrics"
  reports_dir: "results/reports"
